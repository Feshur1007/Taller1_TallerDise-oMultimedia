<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- Google Fonts --> 
    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link 
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&di
    splay=swap" rel="stylesheet"> 
    <!-- Hoja de estilos --> 
    <link rel="stylesheet" href="styles.css"> 
    <!-- Favicon --> 
    <link rel="icon" type="image/svg" href="./logos/favicon.svg"> 
    <title>INICIO SESION</title> 
</head>
<body>
    <div class="login">
        <div class="container">
            <img src="./logos/logo.svg" alt="logo" class="logo">

            
            <form action="/" class="form">
            <label for="password" class="label">Correo Electronico</label>
            <input type="password" id="password" placeholder="email@example.com" class="input input-password">

            <label for="new password" class="label"> Contraseña</label>
            <input type="new-password" id="new-password" placeholder="*********" class="input input-password">

            <input type="submit" value="Ingrese" class="primary-button login-button">
            <p class="reenviar">
                <a href="/">Olvidaste tu contraseña?</a>
            </p>    
        </form>
            <button class="boton-secundario" onclick="location.href='signup.html'">Registrate</button>
            
        </div>
    </div>
    
</body>
</html>
