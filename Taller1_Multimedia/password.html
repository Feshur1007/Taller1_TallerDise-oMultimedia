<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- Google Fonts --> 
    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link 
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&di
    splay=swap" rel="stylesheet"> 
    <!-- Hoja de estilos --> 
    <link rel="stylesheet" href="styles.css"> 
    <!-- Favicon --> 
    <link rel="icon" type="image/svg" href="./logos/favicon.svg"> 
    <title>Contraseña</title> 
</head>
<body>
    <div class="login">
        <div class="container">
            <img src="./logos/logo.svg" alt="logo" class="logo">

            <h1 class="title"> Crea una nueva contraseña</h1>
            <p class="subtitle"> ingreasa una nueva contraseña para tu cuenta</p>

            <form action="/" class="form">
            <label for="password" class="label">Contraseña</label>
            <input type="password" id="password" placeholder="*************" class="input input-password">

            <label for="new password" class="label"> Confirma la contraseña</label>
            <input type="new-password" id="new-password" placeholder="*********" class="input input-password">

            <input type="submit" value="confirm" class="primary-button login-button">
            </form>
            
        </div>
    </div>
    
</body>
</html>
